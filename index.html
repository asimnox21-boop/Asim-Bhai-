<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asim Bhai - SMM Panel</title>

<style>
/* =========================================================
   RESET & VARIABLES
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #1769ff;
    --blue-dark: #0d47c9;
    --blue-light: #eef5ff;
    --blue-border: #d8e7ff;

    --white: #ffffff;
    --background: #f5f8fc;

    --text: #172033;
    --muted: #718096;

    --border: #e1e8f0;

    --danger: #dc2626;
    --danger-bg: #fef2f2;

    --success: #16a34a;
    --success-bg: #f0fdf4;

    --shadow: 0 18px 50px rgba(23, 65, 125, 0.09);

    --radius: 18px;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   AUTHENTICATION
========================================================= */

.auth-screen {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at 10% 10%,
            #dceaff,
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 90%,
            #e7f1ff,
            transparent 32%
        ),
        var(--background);
}

.auth-card {
    width: min(450px, 100%);

    background: var(--white);

    padding: 35px;

    border: 1px solid var(--border);

    border-radius: 25px;

    box-shadow:
        0 25px 70px rgba(20, 60, 120, 0.13);

    animation: authAppear 0.5s ease;
}

@keyframes authAppear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* LOGO */

.auth-logo {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 11px;

    margin-bottom: 28px;
}

.logo-icon {
    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    color: white;

    font-size: 22px;
    font-weight: 900;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #63a8ff
        );
}

.logo-name {
    color: var(--blue);

    font-size: 26px;
    font-weight: 900;
}

.auth-title {
    text-align: center;

    font-size: 27px;

    margin-bottom: 7px;
}

.auth-subtitle {
    text-align: center;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.5;

    margin-bottom: 25px;
}

/* GOOGLE */

.google-button {
    width: 100%;
    height: 51px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 12px;

    border: 1px solid #d7dce5;

    border-radius: 11px;

    background: white;

    color: #202124;

    font-weight: 750;

    transition: 0.2s;
}

.google-button:hover {
    background: #f8fafc;

    box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.07);
}

.google-letter {
    font-size: 20px;
    font-weight: 900;

    color: #4285f4;
}

/* DIVIDER */

.divider {
    display: flex;
    align-items: center;

    gap: 12px;

    margin: 21px 0;

    color: var(--muted);

    font-size: 11px;
    font-weight: 800;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    flex: 1;

    background: var(--border);
}

/* AUTH TABS */

.auth-tabs {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 4px;

    padding: 4px;

    margin-bottom: 20px;

    border-radius: 11px;

    background: #f1f5f9;
}

.auth-tabs button {
    border: 0;

    padding: 11px;

    border-radius: 8px;

    background: transparent;

    color: var(--muted);

    font-weight: 750;
}

.auth-tabs button.active {
    background: white;

    color: var(--blue);

    box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.06);
}

/* FORM */

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    font-size: 13px;
    font-weight: 750;
}

.form-group input,
.form-group select {
    width: 100%;
    height: 49px;

    padding: 0 14px;

    border: 1px solid var(--border);

    border-radius: 11px;

    outline: none;

    background: white;

    color: var(--text);

    transition: 0.2s;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--blue);

    box-shadow:
        0 0 0 4px rgba(23, 105, 255, 0.08);
}

.primary-button {
    width: 100%;
    height: 50px;

    border: 0;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #4c98ff
        );

    color: white;

    font-weight: 800;

    box-shadow:
        0 9px 22px rgba(23, 105, 255, 0.2);
}

.auth-note {
    margin-top: 17px;

    text-align: center;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.5;
}

.auth-message {
    margin-top: 14px;

    padding: 11px 13px;

    border-radius: 9px;

    font-size: 13px;

    display: none;
}

.auth-message.show {
    display: block;
}

.auth-message.error {
    color: var(--danger);

    background: var(--danger-bg);
}

.auth-message.success {
    color: var(--success);

    background: var(--success-bg);
}

/* =========================================================
   APPLICATION NAVBAR
========================================================= */

.navbar {
    height: 72px;

    position: sticky;
    top: 0;

    z-index: 100;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 5%;

    background: white;

    border-bottom: 1px solid var(--border);
}

.brand {
    color: var(--blue);

    font-size: 24px;

    font-weight: 900;
}

.nav-right {
    display: flex;
    align-items: center;

    gap: 13px;
}

.wallet {
    padding: 9px 14px;

    border: 1px solid var(--blue-border);

    border-radius: 11px;

    background: var(--blue-light);

    color: var(--blue-dark);

    font-weight: 800;
}

.profile {
    position: relative;
}

.profile-button {
    display: flex;
    align-items: center;

    gap: 9px;

    padding: 6px 10px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: white;
}

.avatar {
    width: 35px;
    height: 35px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #64a7ff
        );

    color: white;

    font-weight: 900;
}

.profile-menu {
    width: 180px;

    position: absolute;

    top: 49px;
    right: 0;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: white;

    box-shadow: var(--shadow);

    display: none;
}

.profile-menu.show {
    display: block;
}

.profile-menu button {
    width: 100%;

    padding: 13px 15px;

    border: 0;

    background: white;

    color: var(--text);

    text-align: left;
}

.profile-menu button:hover {
    background: var(--blue-light);

    color: var(--blue);
}

/* =========================================================
   MAIN
========================================================= */

.main {
    width: min(1180px, 92%);

    margin: 35px auto;
}

.page {
    display: none;

    animation: pageIn 0.25s ease;
}

.page.active {
    display: block;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.page-heading {
    margin-bottom: 25px;
}

.page-heading h1 {
    font-size: 29px;

    margin-bottom: 6px;
}

.page-heading p {
    color: var(--muted);
}

.dashboard-grid {
    display: grid;

    grid-template-columns: 1.45fr 0.85fr;

    gap: 24px;
}

.card,
.payment-card {
    padding: 27px;

    border: 1px solid var(--border);

    border-radius: var(--radius);

    background: white;

    box-shadow: var(--shadow);
}

.card h2 {
    font-size: 19px;

    margin-bottom: 22px;
}

/* SERVICE INFO */

.service-info {
    margin-top: -7px;

    margin-bottom: 18px;

    color: var(--muted);

    font-size: 13px;
}

/* BUTTON */

.action-button {
    width: 100%;
    height: 50px;

    border: 0;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #4c98ff
        );

    color: white;

    font-weight: 800;
}

.action-button:hover {
    background: var(--blue-dark);
}

/* =========================================================
   PRICE MACHINE
========================================================= */

.machine {
    display: flex;

    flex-direction: column;

    align-items: center;
}

.gauge {
    width: 230px;
    height: 125px;

    position: relative;

    overflow: hidden;

    margin: 10px 0 20px;
}

.gauge-bg,
.gauge-fill {
    position: absolute;

    width: 230px;
    height: 230px;

    border-radius: 50%;
}

.gauge-bg {
    border: 20px solid #e8f0fa;

    border-bottom-color: transparent;

    transform: rotate(45deg);
}

.gauge-fill {
    border: 20px solid transparent;

    border-top-color: var(--blue);
    border-left-color: var(--blue);
    border-bottom-color: var(--blue);

    transform: rotate(45deg);

    transition: transform 0.4s ease;
}

.gauge-center {
    position: absolute;

    bottom: 0;

    width: 100%;

    text-align: center;
}

.gauge-center strong {
    display: block;

    font-size: 25px;
}

.gauge-center span {
    color: var(--muted);

    font-size: 12px;
}

.charge-box {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 17px;

    border: 1px solid var(--blue-border);

    border-radius: 14px;

    background: var(--blue-light);
}

.charge-box span {
    color: var(--muted);
}

.charge-box strong {
    color: var(--blue);

    font-size: 24px;
}

/* =========================================================
   ADD FUNDS
========================================================= */

.payment-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 24px;
}

.payment-icon {
    width: 50px;
    height: 50px;

    display: grid;
    place-items: center;

    margin-bottom: 15px;

    border-radius: 13px;

    background: var(--blue-light);

    color: var(--blue);

    font-weight: 900;
}

.payment-card h3 {
    margin-bottom: 7px;
}

.payment-card > p {
    margin-bottom: 20px;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.5;
}

.qr-wrap {
    display: flex;
    justify-content: center;

    margin: 17px 0 20px;
}

.qr-wrap img {
    width: 175px;
    height: 175px;

    padding: 8px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: white;
}

.phonepe-link {
    display: block;

    padding: 14px;

    margin-bottom: 19px;

    border: 1px solid #bbf7d0;

    border-radius: 10px;

    background: var(--success-bg);

    color: #15803d;

    text-align: center;

    text-decoration: none;

    font-weight: 800;
}

/* =========================================================
   NOTIFICATION
========================================================= */

.notification {
    width: min(400px, calc(100% - 40px));

    position: fixed;

    top: 90px;
    right: 20px;

    z-index: 500;

    padding: 16px 18px;

    border-left: 5px solid var(--danger);

    border-radius: 13px;

    background: white;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.13);

    display: none;

    animation: notificationIn 0.3s ease;
}

.notification.show {
    display: block;
}

.notification.success {
    border-left-color: var(--success);
}

.notification strong {
    display: block;

    margin-bottom: 4px;
}

.notification p {
    color: var(--muted);

    font-size: 13px;
}

/* =========================================================
   PAYMENT MODAL
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(10, 25, 55, 0.58);

    backdrop-filter: blur(5px);
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(440px, 100%);

    padding: 31px;

    border-radius: 21px;

    background: white;

    text-align: center;

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.22);

    animation: modalIn 0.25s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(0.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.spinner {
    width: 55px;
    height: 55px;

    margin: 0 auto 20px;

    border: 5px solid #dceaff;

    border-top-color: var(--blue);

    border-radius: 50%;

    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.success-icon {
    width: 65px;
    height: 65px;

    display: grid;
    place-items: center;

    margin: 0 auto 17px;

    border-radius: 50%;

    background: #dcfce7;

    color: var(--success);

    font-size: 32px;
    font-weight: 900;
}

.modal h3 {
    margin-bottom: 10px;

    font-size: 21px;
}

.modal p {
    color: var(--muted);

    font-size: 14px;

    line-height: 1.55;
}

.modal-button {
    width: 100%;
    height: 48px;

    margin-top: 22px;

    border: 0;

    border-radius: 10px;

    background: var(--blue);

    color: white;

    font-weight: 800;
}

/* =========================================================
   GOOGLE MOCK ACCOUNT MODAL
========================================================= */

.google-overlay {
    position: fixed;

    inset: 0;

    z-index: 2000;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(10, 25, 55, 0.55);

    backdrop-filter: blur(5px);
}

.google-modal {
    width: min(390px, 100%);

    padding: 28px;

    border-radius: 20px;

    background: white;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.25);

    animation: modalIn 0.25s ease;
}

.google-modal-logo {
    width: 46px;
    height: 46px;

    display: grid;
    place-items: center;

    margin: 0 auto 15px;

    border: 1px solid #ddd;

    border-radius: 50%;

    color: #4285f4;

    font-size: 21px;
    font-weight: 900;
}

.google-modal h2 {
    text-align: center;

    font-size: 21px;

    margin-bottom: 7px;
}

.google-modal-description {
    text-align: center;

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 20px;
}

.mock-account {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 13px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: white;

    text-align: left;

    transition: 0.2s;
}

.mock-account:hover {
    background: var(--blue-light);

    border-color: var(--blue-border);
}

.mock-avatar {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #64a7ff
        );

    color: white;

    font-weight: 800;
}

.mock-account-name {
    display: block;

    margin-bottom: 3px;

    color: var(--text);

    font-size: 14px;

    font-weight: 800;
}

.mock-account-email {
    color: var(--muted);

    font-size: 12px;
}

.cancel-google {
    width: 100%;

    margin-top: 12px;

    padding: 12px;

    border: 0;

    border-radius: 10px;

    background: #f5f8fc;

    color: var(--muted);

    font-weight: 700;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 850px) {

    .dashboard-grid,
    .payment-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {

    .navbar {
        padding: 0 4%;
    }

    .brand {
        font-size: 20px;
    }

    .wallet {
        padding: 8px 10px;

        font-size: 12px;
    }

    .profile-button span {
        display: none;
    }

    .main {
        width: 94%;

        margin: 25px auto;
    }

    .card,
    .payment-card {
        padding: 21px;
    }

    .page-heading h1 {
        font-size: 24px;
    }

    .auth-card {
        padding: 28px 21px;
    }
}

@keyframes notificationIn {

    from {
        opacity: 0;
        transform: translateX(30px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

</style>
</head>

<body>

<!-- =========================================================
     LOGIN / SIGN-UP SCREEN
========================================================= -->

<section id="authScreen" class="auth-screen">

    <div class="auth-card">

        <div class="auth-logo">

            <div class="logo-icon">
                A
            </div>

            <div class="logo-name">
                Asim Bhai
            </div>

        </div>


        <h1 class="auth-title">
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Sign in or create an account to access your SMM Panel.
        </p>


        <!-- GOOGLE BUTTON -->

        <button
            type="button"
            class="google-button"
            id="googleButton"
        >

            <span class="google-letter">
                G
            </span>

            Continue with Google

        </button>


        <div class="divider">
            OR
        </div>


        <!-- LOGIN / SIGNUP TABS -->

        <div class="auth-tabs">

            <button
                id="loginTab"
                class="active"
                type="button"
            >
                Login
            </button>

            <button
                id="signupTab"
                type="button"
            >
                Sign Up
            </button>

        </div>


        <form id="authForm">

                id="nameGroup"
            >

                <label>
                    Full Name
                </label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="Enter your full name"
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div
                class="form-group hidden"
                id="confirmGroup"
            >

                <label>
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm your password"
                >

            </div>


            <button
                type="submit"
                class="primary-button"
                id="authButton"
            >
                Login
            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message"
        ></div>


        <p class="auth-n
